[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_MEASUREMENT_ID"
  VITE_USE_FIREBASE = "true"
  VITE_FIREBASE_API_KEY = "AIzaSyDwzlLrpDvTK06p0wP8iRRvF1nOtes2lXg"
  VITE_FIREBASE_AUTH_DOMAIN = "delivery-challan-84604.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "delivery-challan-84604"
  VITE_FIREBASE_STORAGE_BUCKET = "delivery-challan-84604.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "998682917696"
  VITE_FIREBASE_APP_ID = "1:998682917696:web:7357a8ffef95e72d5598a5"
  VITE_FIREBASE_MEASUREMENT_ID = "G-173LLW9034"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self 'https://api.razorpay.com')"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://*.firebaseapp.com https://apis.google.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.firebasestorage.app https://firebasestorage.googleapis.com https://*.googleusercontent.com https://www.google.com https://*.google.com; connect-src 'self' https://firestore.googleapis.com https://*.firestore.googleapis.com https://*.googleapis.com https://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://api.razorpay.com https://lumberjack.razorpay.com https://*.firebasestorage.app; frame-src 'self' https://api.razorpay.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self';"
